<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>测评管理后台</title>
  <link rel="stylesheet" href="css/style.css?v=14" />
</head>
<body class="admin">
  <main class="app">
    <!-- 登录 -->
    <section id="admin-login" class="screen">
      <div class="auth-card">
        <div class="auth-badge">测</div>
        <h1>测评管理后台</h1>
        <p class="auth-sub">输入管理员密钥进入</p>
        <label class="field-label" for="admin-key">管理员密钥</label>
        <input id="admin-key" class="field" type="password" placeholder="请输入管理员密钥" autocomplete="off" />
        <button id="btn-login" class="btn btn-primary">进入后台</button>
        <p id="login-msg" class="msg"></p>
      </div>
    </section>

    <!-- 控制台 -->
    <section id="admin-dash" class="screen hidden">
      <header class="topbar">
        <div class="brand">
          <span class="logo">测</span>
          <div class="brand-txt">
            <b>测评管理后台</b>
            <small>题库 · 访问码 · 多主题同时可用</small>
          </div>
        </div>
        <div class="topbar-actions">
          <button id="btn-refresh" class="btn btn-ghost sm">刷新</button>
          <button id="btn-logout" class="btn btn-ghost sm">退出</button>
        </div>
      </header>

      <div class="dash-grid">
        <!-- 题库管理 -->
        <section class="panel">
          <div class="panel-head">
            <h2>题库管理</h2>
            <span class="panel-sub">「已启用」= 默认测评，未绑定题库的访问码都用它。每套测评有专属链接，可直接上架不同商品。</span>
          </div>
          <div class="panel-tools">
            <button id="btn-copy-all-links" class="btn btn-ghost sm">复制全部主题链接</button>
          </div>
          <div id="quiz-list" class="quiz-list"></div>
          <p id="quiz-msg" class="msg"></p>

          <details class="import-box">
            <summary>导入新题库（粘贴 JSON，自动识别 level / type）</summary>
            <textarea id="import-json" class="import-area" placeholder='粘贴格式示例：
{
  "id": "myquiz",
  "title": "我的测评",
  "intro": "一句话介绍",
  "resultMode": "level",          // 可省略，系统自动识别
  "questions": [
    { "q": "问题？", "options": [
        { "text": "选项A", "score": 3 },
        { "text": "选项B", "score": 0 }
    ]}
  ],
  "levels": [ { "min": 0, "label": "档1", "analysis": "..." } ]
}
// 若用 type 模式，选项改为 scores:{"A":3} 并提供 types 数组'></textarea>
            <button id="btn-import" class="btn btn-primary">导入题库</button>
            <p id="import-msg" class="msg"></p>
          </details>
        </section>

        <!-- 访问码管理 -->
        <section class="panel">
          <div class="panel-head">
            <h2>访问码管理</h2>
            <span class="panel-sub">每个码绑定一套测评；不同码可同时测不同主题，互不干扰。</span>
          </div>

          <div class="gen-grid">
            <select id="gen-quiz" class="field span2"></select>
            <input id="gen-count" class="field" type="number" min="1" max="500" value="10" placeholder="数量" />
            <input id="gen-note" class="field" type="text" placeholder="备注（如订单号）" />
            <button id="btn-gen" class="btn btn-primary span2">生成访问码</button>
          </div>
          <p class="gen-tip">「绑定测评」留空 = 默认测评（跟随上面已启用的那套）。每个码可测 3 次。</p>

          <p id="dash-msg" class="msg"></p>
          <div id="code-table" class="code-table"></div>
        </section>
      </div>
    </section>
  </main>

  <!-- 依赖已下载到本地 lib/：自包含、不依赖外部 CDN -->
  <script src="lib/supabase.min.js?v=14"></script>
  <script src="js/config.js?v=14"></script>
  <script src="js/quizzes.js?v=14"></script>
  <script src="js/supabase.js?v=14"></script>
  <script src="js/admin.js?v=14"></script>
</body>
</html>
